[general]
static=yes
writeprotect=no

[incoming]
; Incoming from provider -> Stasis gemini-live
; Independent paths: MixMonitor recording + ExternalMedia via ARI
exten => _X.,1,NoOp(CALL_INCOMING caller=${CALLERID(num)} dest=${EXTEN})
 same => n,Set(CALL_ID=call_${STRFTIME(${EPOCH},,%Y%m%d_%H%M%S)}_${RAND(1000,9999)})
 same => n,NoOp(CALL_ID=${CALL_ID})
 same => n,Set(CDR(call_id)=${CALL_ID})
 same => n,Answer()
 same => n,NoOp(CALL_ANSWERED call_id=${CALL_ID})
 same => n,Set(RECORDING_FILE=/var/spool/asterisk/recordings/${CALL_ID}.wav)
 same => n,MixMonitor(${RECORDING_FILE},b,)
 same => n,NoOp(RECORDING_STARTED file=${RECORDING_FILE} call_id=${CALL_ID})
 same => n,Stasis(gemini-live,${CALL_ID})
 same => n,NoOp(CALL_ENDED call_id=${CALL_ID})
 same => n,StopMixMonitor()
 same => n,System(/usr/local/bin/upload-recording.sh "${CALL_ID}" "${CALLERID(num)}" "${EXTEN}" "${RECORDING_FILE}" &)
 same => n,Hangup()

; optional hangup handler
exten => h,1,NoOp(Hangup call_id=${CALL_ID})
 same => n,StopMixMonitor()
 same => n,Return()

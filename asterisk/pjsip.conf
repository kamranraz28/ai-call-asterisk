; PJSIP config - uses env vars via Asterisk env inclusion
; Install: copy to /etc/asterisk/pjsip.conf and set env or replace ${VAR}
; Requires: Asterisk 18+ with PJSIP

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=0.0.0.0/0
external_media_address=${SIP_EXTERNAL_IP:}
external_signaling_address=${SIP_EXTERNAL_IP:}

; SIP Provider trunk - SECOND account
[provider]
type=registration
transport=transport-udp
outbound_auth=provider_auth
server_uri=sip:${SIP_SERVER}
client_uri=sip:${SIP_USERNAME}@${SIP_SERVER}
retry_interval=60
forbidden_retry_interval=30
expiration=3600
contact_user=${SIP_USERNAME}

[provider_auth]
type=auth
auth_type=userpass
username=${SIP_USERNAME}
password=${SIP_PASSWORD}

[provider_aor]
type=aor
contact=sip:${SIP_SERVER}:5060
qualify_frequency=60

[provider_endpoint]
type=endpoint
transport=transport-udp
context=incoming
disallow=all
allow=ulaw
allow=alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
timers=yes
aors=provider_aor
outbound_auth=provider_auth
from_user=${SIP_USERNAME}
from_domain=${SIP_SERVER}
dtmf_mode=rfc4733

[provider_identify]
type=identify
endpoint=provider_endpoint
match=${SIP_SERVER}

; Local Node bridge - not a SIP peer, RTP handled via ARI ExternalMedia
